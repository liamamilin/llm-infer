<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="currentColor"><title>Prefill 与 Decode</title><desc>提示词先经过 Prefill 并行处理，随后 Decode 每步生成一个 token 并循环</desc><rect x="20" y="70" width="130" height="56" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="85.0" y="96.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">提示词</text><text x="85.0" y="113.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">N 个 token</text><rect x="200" y="70" width="150" height="56" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="275.0" y="96.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">Prefill</text><text x="275.0" y="113.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">一次并行处理 N 个</text><rect x="400" y="70" width="130" height="56" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="465.0" y="96.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">第 1 个 token</text><text x="465.0" y="113.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">同时产出 KV Cache</text><rect x="560" y="70" width="140" height="56" rx="8" fill="#f0a03022" stroke="#f0a030" stroke-width="1.6"/><text x="630.0" y="96.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">Decode</text><text x="630.0" y="113.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">每步 1 个 token，循环</text><line x1="150" y1="98" x2="198" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="198,98 190.6,101.1 190.6,94.9" fill="#8a8f98"/><line x1="350" y1="98" x2="398" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="398,98 390.6,101.1 390.6,94.9" fill="#8a8f98"/><line x1="530" y1="98" x2="558" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="558,98 550.6,101.1 550.6,94.9" fill="#8a8f98"/><path d="M630 128 C630 175 630 175 630 175 L630 175 C560 175 560 135 600 130" fill="none" stroke="#f0a030" stroke-width="1.6" stroke-dasharray="4 3"/><text x="630" y="200" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">读取并追加 KV Cache，直到遇到停止条件</text></svg>
