<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="currentColor"><title>稳定服务架构</title><desc>请求依次经过就绪检查、准入控制、排队与引擎，由守护进程托管并输出日志和指标</desc><rect x="10" y="95" width="90" height="50" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="55.0" y="124.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">客户端</text><rect x="140" y="95" width="120" height="50" rx="8" fill="none" stroke="#f0a030" stroke-width="1.6"/><text x="200.0" y="118.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">/readyz</text><text x="200.0" y="135.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">未就绪 → 503</text><rect x="300" y="95" width="130" height="50" rx="8" fill="none" stroke="#f0a030" stroke-width="1.6"/><text x="365.0" y="118.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">准入控制</text><text x="365.0" y="135.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">超限 → 429</text><rect x="470" y="95" width="120" height="50" rx="8" fill="none" stroke="#f0a030" stroke-width="1.6"/><text x="530.0" y="118.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">排队</text><text x="530.0" y="135.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">超时 → 503</text><rect x="620" y="95" width="90" height="50" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="665.0" y="118.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">引擎</text><text x="665.0" y="135.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">超时 → 截断</text><line x1="100" y1="120" x2="140" y2="120" stroke="#8a8f98" stroke-width="1.6"/><polygon points="140,120 132.6,123.1 132.6,116.9" fill="#8a8f98"/><line x1="260" y1="120" x2="300" y2="120" stroke="#8a8f98" stroke-width="1.6"/><polygon points="300,120 292.6,123.1 292.6,116.9" fill="#8a8f98"/><line x1="430" y1="120" x2="470" y2="120" stroke="#8a8f98" stroke-width="1.6"/><polygon points="470,120 462.6,123.1 462.6,116.9" fill="#8a8f98"/><line x1="590" y1="120" x2="620" y2="120" stroke="#8a8f98" stroke-width="1.6"/><polygon points="620,120 612.6,123.1 612.6,116.9" fill="#8a8f98"/><rect x="140" y="10" width="570" height="40" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.6"/><text x="425.0" y="28.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">守护进程 supervisor</text><text x="425.0" y="45.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">子进程退出就重启；SIGTERM 时先送完在途请求</text><rect x="300" y="190" width="290" height="40" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.6"/><text x="445.0" y="208.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">JSON 日志 + /metrics</text><text x="445.0" y="225.0" font-size="11" text-anchor="middle" fill="#8a8f98" font-weight="normal">每个请求带 request_id</text><line x1="365" y1="145" x2="365" y2="188" stroke="#8a8f98" stroke-width="1.6"/><polygon points="365,188 361.9,180.6 368.1,180.6" fill="#8a8f98"/></svg>
