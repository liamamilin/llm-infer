<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="currentColor"><title>前缀缓存对首 token 延迟的影响</title><desc>关闭与命中前缀缓存时首 token 延迟 p50，来自 ch08-prefix_cache.json</desc><text x="160" y="36" font-size="14" text-anchor="start" fill="currentColor" font-weight="600">同一段约 1845 token 的前缀，首 token 延迟 p50</text><line x1="160" x2="560" y1="200.0" y2="200.0" stroke="#8a8f9833"/><line x1="160" x2="560" y1="162.5" y2="162.5" stroke="#8a8f9833"/><line x1="160" x2="560" y1="125.0" y2="125.0" stroke="#8a8f9833"/><line x1="160" x2="560" y1="87.5" y2="87.5" stroke="#8a8f9833"/><line x1="160" x2="560" y1="50.0" y2="50.0" stroke="#8a8f9833"/><rect x="237.0" y="72.9" width="43.0" height="127.1" rx="3" fill="#4f7cff"/><text x="258.5" y="67.88135593220339" font-size="11" text-anchor="middle" fill="currentColor" font-weight="normal">93.5</text><text x="260.0" y="218" font-size="12" text-anchor="middle" fill="currentColor" font-weight="normal">关闭缓存</text><rect x="437.0" y="149.8" width="43.0" height="50.2" rx="3" fill="#4f7cff"/><text x="458.5" y="144.83232121816368" font-size="11" text-anchor="middle" fill="currentColor" font-weight="normal">36.9</text><text x="460.0" y="218" font-size="12" text-anchor="middle" fill="currentColor" font-weight="normal">命中缓存</text><text x="560" y="36" font-size="11" text-anchor="end" fill="#8a8f98" font-weight="normal">毫秒（ms）</text></svg>
