<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="currentColor"><title>引擎选型流程</title><desc>按瓶颈类型选择：单用户留在 Transformers，并发用 vLLM，显存不足用量化，共享前缀用前缀缓存</desc><rect x="240" y="10" width="240" height="40" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="360.0" y="34.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">你的瓶颈是什么？</text><line x1="360" y1="50" x2="90" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="90,98 96.7,93.6 97.8,99.8" fill="#8a8f98"/><rect x="10" y="100" width="160" height="44" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="90.0" y="126.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">单用户、吞吐够用</text><line x1="90" y1="144" x2="90" y2="178" stroke="#8a8f98" stroke-width="1.6"/><polygon points="90,178 86.9,170.6 93.1,170.6" fill="#8a8f98"/><rect x="10" y="180" width="160" height="44" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="90.0" y="206.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">留在 Transformers</text><line x1="360" y1="50" x2="270" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="270,98 275.0,91.8 278.0,97.3" fill="#8a8f98"/><rect x="190" y="100" width="160" height="44" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="270.0" y="126.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">并发高 / 首字慢</text><line x1="270" y1="144" x2="270" y2="178" stroke="#8a8f98" stroke-width="1.6"/><polygon points="270,178 266.9,170.6 273.1,170.6" fill="#8a8f98"/><rect x="190" y="180" width="160" height="44" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="270.0" y="206.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">考虑 vLLM（ch09）</text><line x1="360" y1="50" x2="450" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="450,98 442.0,97.3 445.0,91.8" fill="#8a8f98"/><rect x="370" y="100" width="160" height="44" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="450.0" y="126.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">显存放不下</text><line x1="450" y1="144" x2="450" y2="178" stroke="#8a8f98" stroke-width="1.6"/><polygon points="450,178 446.9,170.6 453.1,170.6" fill="#8a8f98"/><rect x="370" y="180" width="160" height="44" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="450.0" y="206.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">量化（ch07）</text><line x1="360" y1="50" x2="630" y2="98" stroke="#8a8f98" stroke-width="1.6"/><polygon points="630,98 622.2,99.8 623.3,93.6" fill="#8a8f98"/><rect x="550" y="100" width="160" height="44" rx="8" fill="none" stroke="#4f7cff" stroke-width="1.6"/><text x="630.0" y="126.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">大量共享前缀</text><line x1="630" y1="144" x2="630" y2="178" stroke="#8a8f98" stroke-width="1.6"/><polygon points="630,178 626.9,170.6 633.1,170.6" fill="#8a8f98"/><rect x="550" y="180" width="160" height="44" rx="8" fill="#4f7cff22" stroke="#4f7cff" stroke-width="1.6"/><text x="630.0" y="206.0" font-size="13" text-anchor="middle" fill="currentColor" font-weight="600">前缀缓存（ch08）</text><text x="360" y="258" font-size="12" text-anchor="middle" fill="#8a8f98" font-weight="normal">无论选哪个：先照第 09 章在自己的硬件和流量上测一遍</text></svg>
