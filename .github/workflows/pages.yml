name: Build and deploy book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python smoke tests (no model download; experiment tests skip without .venv)
        run: python -m unittest discover -s tests -v
      - name: Set project-site base
        run: |
          if [[ "$GITHUB_REPOSITORY" == "$GITHUB_REPOSITORY_OWNER/$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            echo 'VITEPRESS_BASE=/' >> "$GITHUB_ENV"
          else
            echo "VITEPRESS_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Install pinned dependencies
        run: npm ci
      - name: Build static site
        run: npm run docs:build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
